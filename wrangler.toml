# Cloudflare Pages — sitio estático (sin build). Los thumbnails se generan localmente con
# `node scripts/build-references.mjs` y se commitean en assets/thumbs + js/references.data.js.

version = 1

[build]
  command = "echo 'Static site - no build needed'"
  publish = "."

[build.environment]
  NODE_VERSION = "18"
